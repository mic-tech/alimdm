services:
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: ali-mdm:latest
    restart: unless-stopped
    environment:
      ALIMDM_ADDR: ":8080"
      ALIMDM_DB: "/data/alimdm.db"
      ALIMDM_CONSOLE_DIR: "/app/console-dist"
      ALIMDM_APK_ROOT: "/data/apks"
      # REQUIRED: set a strong secret + enroll token before first start
      ALIMDM_SECRET: "${ALIMDM_SECRET:-CHANGE_ME_SECRET}"
      ALIMDM_ENROLL_TOKEN: "${ALIMDM_ENROLL_TOKEN:-CHANGE_ME_ENROLL}"
      ALIMDM_BASE_URL: "${ALIMDM_BASE_URL:-https://cloud.example.com}"
      # Needed before QR enrollment will produce a code; see .env.example.
      ALIMDM_PROVISION_CHECKSUM: "${ALIMDM_PROVISION_CHECKSUM:-}"
      ALIMDM_ORG_ID: "${ALIMDM_ORG_ID:-}"
      # Optional MQTT poke (uncomment + set to enable low-latency command wake)
      # ALIMDM_MQTT_URL: "tcp://mqtt:1883"
    volumes:
      - fk-data:/data
    ports:
      # Exposed for Caddy to proxy. Keep this internal in prod (bind to 127.0.0.1).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CLOUD_DOMAIN: "${CLOUD_DOMAIN:-cloud.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  fk-data:
  caddy-data:
  caddy-config:

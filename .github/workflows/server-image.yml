# Build the Ali MDM cloud image and push it to Docker Hub.
#
# Replaces building on a laptop and shipping the result over SSH with
# `docker save | gzip | ssh docker load`, which works but means the image that
# reaches the server is whatever happened to be in one person's working tree.
# Here the input is a commit.
#
# Setup, once:
#   1. Docker Hub → Account Settings → Personal access tokens → new token with
#      Read & Write. A token, not the account password: it is scoped and can be
#      revoked without changing the login.
#   2. GitHub → repo → Settings → Secrets and variables → Actions:
#        Secret   DOCKERHUB_TOKEN     the token from step 1
#        Variable DOCKERHUB_USERNAME  the Docker Hub account/org name
#      The username is a variable rather than a secret so the image tags are
#      readable in the build log; a masked namespace makes every failure a
#      guessing game.
name: Server image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only when something the image is built from actually changes. The Android
    # app shares this repo and has nothing to do with this image.
    paths:
      - "apps/server/**"
      - "apps/console/**"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fail here, with the fix, rather than three minutes later on a push to
      # an image called "/alimdm-cloud".
      - name: Check the Docker Hub namespace is configured
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Set the repository variable DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/alimdm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Built first and kept local, so a vulnerable image is never published.
      # Scanning after the push means the bad artifact is already pullable and
      # the only remedy is deleting a tag people may have.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          push: false
          # The VPS is x86-64. Adding linux/arm64 roughly doubles the build for
          # a target nothing runs on yet.
          platforms: linux/amd64
          tags: alimdm-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed, because a finding with no fix available is not something
      # a build can act on — failing on it would only teach people to ignore a
      # red build. Anything with a published fix is a dependency bump away and
      # should stop the release.
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: alimdm-cloud:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Fully cached by the build above, so this is a push and nothing more.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summarise what was pushed
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
